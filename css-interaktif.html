<script>
const U=[
{t:"Pengantar: Apa itu Ilmu Sosial Komputasional?",b:`<p>Ilmu Sosial Komputasional (<b>Computational Social Science/CSS</b>) adalah pendekatan lintas disiplin untuk <b>menangkap, menganalisis, memodelkan, dan menyimulasikan</b> fenomena sosial, politik, dan komunikasi, memakai metode ilmu komputer, matematika, dan statistik pada data ilmu sosial (survei, teks media, data eksperimen).</p>
<div class="key">Ilmu sosial bertanya <b>apa yang menyebabkan apa</b> (berbasis teori). Sains Data menyediakan alat untuk data yang besar dan kompleks. CSS lahir dari pertemuan keduanya.</div>
<details open><summary>Contoh pertanyaan penelitian</summary><div><b>Isi:</b> Seberapa besar pemilih mengubah preferensi partai selama kampanye? Topik apa yang diangkat partai di media sosial dan bagaimana memengaruhi agenda partai lain?<br><b>Metodologi:</b> Siapa yang cenderung ikut survei berulang (multi-wave)? Apakah jawaban survei konsisten secara internal?</div></details>
<details><summary>Sains Data & subbidangnya</summary><div><b>Data mining</b>: menggali pengetahuan dari data masif · <b>Machine learning</b>: tugas pembelajaran kompleks (mis. deep learning untuk terjemahan) · <b>Visualisasi</b>: membuat data berdimensi tinggi bisa dipahami manusia.</div></details>
<details><summary>Peta kursus (6 pelajaran)</summary><div>1) Pengantar · 2) Landasan metodologis (data & ilmu sosial) · 3) Praktik: pengumpulan data, analisis, visualisasi · 4) Praktik lanjutan · 5) Tantangan hukum & etika · 6) Topik terkini.</div></details>
<p>Contoh integrasi: data survei (faktor individu) + analisis media sosial (topik tren) digabung dengan machine learning untuk memprediksi preferensi partai, dengan tetap memperhatikan implikasi etis dan hukum.</p>`,
q:["Apa inti pertanyaan ilmu sosial yang membuatnya berbeda dari sekadar analisis data?",["Berapa banyak data tersedia","Pertanyaan diturunkan secara teoretis (apa yang menyebabkan apa)","Algoritma mana tercepat"],1,"Pertanyaan riset ilmu sosial berlandaskan teori tentang mekanisme yang menghubungkan faktor-faktor."]},
{t:"Kolaborasi Ilmu Sosial × Ilmu Data",b:`<p>Diskusi para profesor (Waldherr, Boomgaarden, Plant, Kritzinger) tentang bagaimana kedua bidang saling melengkapi.</p>
<table><tr><th></th><th>Ilmu Sosial</th><th>Ilmu Data</th></tr><tr><td>Titik tolak</td><td>Teori kuat, model diuji dengan data</td><td>Pengenalan pola, teori sering belakangan</td></tr><tr><td>Kekuatan</td><td>Model teoretis, validitas konsep</td><td>Algoritma untuk data besar/kompleks</td></tr></table>
<details open><summary>Peluang yang disebut</summary><div>• <b>Visi komputer</b> (gambar/audiovisual) dan <b>analisis deret waktu</b> data jejak digital.<br>• <b>Ilmu Komunikasi Komputasional</b>: teks (NLP), data jaringan (siapa mengikuti siapa), metadata/log smartphone, simulasi model teori, dan eksperimen/survei di platform riset khusus.<br>• Data survei makin terbuka untuk publik; pola bisa dicari tanpa tujuan analitis spesifik di awal (menghasilkan hipotesis baru).</div></details>
<details><summary>Tantangan</summary><div>• <b>Validitas</b>: apakah yang diukur algoritma sesuai teori?<br>• <b>Interpretabilitas</b> hasil algoritma + visualisasi (hati-hati: manusia mudah percaya pada apa yang terlihat).<br>• Menghormati <b>privasi</b>. Data kecil pun bisa butuh algoritma kompleks (mis. 500 peserta dalam banyak jaringan kelas kecil).<br>• Etika & hukum selalu dipertimbangkan.</div></details>`,
q:["Apa kekhawatiran Boomgaarden tentang algoritma?",["Terlalu lambat","Validitas: apakah yang diukur sesuai dengan teori","Terlalu mahal"],1,"Ia menekankan memastikan algoritma mengukur apa yang seharusnya diukur menurut teori."]},
{t:"Dua Tradisi: Ilmu Sosial vs Ilmu Data",b:`<div class="key"><b>Deduktif</b>: dari teori umum → hipotesis → diuji empiris. <b>Induktif</b>: dari pengamatan spesifik → pola/struktur umum.</div>
<p>Ilmu sosial kuantitatif dominan <b>deduktif</b> (data tidak "dibiarkan berbicara"), sementara ilmu data memakai <b>induktif</b> (risiko: pola yang hanya <i>artefak</i> dan tak bisa dijelaskan teori). Kombinasi keduanya membantu mengidentifikasi rantai sebab-akibat.</p>
<details><summary>Data yang dipakai CSS</summary><div>Data kuantitatif <b>longitudinal</b> (antar waktu) dan <b>cross-sectional</b>; data registrasi (mis. kesehatan), survei, teks, eksperimen.</div></details>
<details><summary>Tentang ilmu data</summary><div>Muncul sebagai istilah pada 1960-an; interdisipliner (ilmu komputer, matematika, statistik); fokus mengekstrak informasi yang mudah dipahami dari data besar dan memvisualisasikannya.</div></details>`,
q:["Risiko utama pendekatan induktif murni?",["Mengidentifikasi pola yang merupakan artefak tanpa penjelasan teoretis","Terlalu banyak hipotesis","Tidak bisa memakai komputer"],0,"Pola bisa muncul karena artefak data, bukan fenomena nyata."]},
{t:"Representasi Data & Tugas Pembelajaran",b:`<p>Contoh jaringan pertemanan siswa: <b>node</b> = orang, <b>edge</b> = hubungan. Node punya <b>atribut</b> (usia = numerik, sudah ikut pelajaran = biner). Edge bisa tak berbobot/berbobot dan tak berarah/berarah; memilih apa yang ditangkap adalah <i>keputusan pemodelan</i>.</p>
<div class="key">Di komputer, jaringan disimpan sebagai <b>matriks</b> (baris & kolom = node; sel =1 jika terhubung, 0 jika tidak; berbobot → sel berisi bobot). Atribut disimpan di tabel terpisah (baris = node, kolom = atribut).</div>
<details open><summary>Tiga tugas dasar</summary><div><b>Representation learning</b>: mencari representasi/visualisasi lebih baik (mis. ruang 2D). Muncul <i>homofili sosial</i>: orang serupa cenderung berteman.<br><b>Clustering</b>: kelompok alami (objek serupa satu cluster). Menyusun ulang baris/kolom memunculkan blok angka 1 di diagonal; <b>entropi</b> rendah = tabel rapi = clustering baik.<br><b>Link prediction</b>: memprediksi pertemanan baru; node yang dekat di ruang vektor lebih mungkin terhubung.</div></details>
<details><summary>Tanpa vs dengan pengawasan</summary><div><b>Unsupervised</b> (representation learning, clustering): hanya diberi data, eksplorasi pola. <b>Supervised</b> (link prediction): ada data latih + tujuan belajar yang jelas.</div></details>`,
q:["Clustering dan representation learning termasuk jenis pembelajaran apa?",["Terawasi (supervised)","Tak terawasi (unsupervised)","Penguatan"],1,"Keduanya tidak memerlukan data latih berlabel terpisah."]},
{t:"Pembelajaran Terawasi & Generalisasi",b:`<p>Proses data: rumuskan pertanyaan → kumpulkan & siapkan data → iterasi eksplorasi, pemodelan, analisis → penyempurnaan.</p>
<details open><summary>Unsupervised vs supervised</summary><div><b>Unsupervised</b>: tak ada target (mis. mengelompokkan orang berdasar perilaku memilih). <b>Supervised</b>: ada target (mis. memprediksi afiliasi partai; memprediksi apakah peserta ikut jajak berikutnya = <i>survey attrition</i>). Jenisnya: <b>regresi</b> (target bilangan real) & <b>klasifikasi</b> (kategori).</div></details>
<details><summary>Komponen kunci</summary><div>Data = pasangan (<b>fitur</b>, target); teks/gambar harus diubah dulu jadi vektor. <b>Fitur yang baik</b> menentukan keberhasilan. Model dilatih dengan meminimalkan <b>fungsi kesalahan</b>.<br><b>Regresi linier</b>: kesalahan kuadrat; bobot fitur bisa diinterpretasi. <b>Regresi logistik</b>: klasifikasi biner, output = probabilitas (loss: cross-entropy).</div></details>
<div class="key"><b>Overfitting</b>: model cocok sekali pada data latih tapi buruk pada data baru (generalisasi buruk). Terjadi bila data latih sedikit dibanding kompleksitas model. Solusi: tambah data atau <b>regularisasi</b>.</div>`,
q:["Mana yang merupakan tanda overfitting?",["Akurasi rendah di data latih dan uji","Akurasi tinggi di data latih, rendah di data uji","Akurasi sama di keduanya"],1,"Model menghafal data latih sehingga tak menggeneralisasi."]},
{t:"Paradigma & Pendekatan Filosofis (2.4)",b:`<p>Ilmu sosial bersifat <b>poliparadigmatik</b>: ada asumsi berbeda namun sama-sama valid. Empat aliran epistemologis (Creswell & Creswell):</p>
<table><tr><th>Aliran</th><th>Ciri</th><th>Contoh</th></tr><tr><td>Post-positivis</td><td>Kausalitas probabilistik, diuji; biasanya kuantitatif</td><td>Minat politik vs frekuensi konsumsi berita</td></tr><tr><td>Konstruktivis</td><td>Sikap dibangun dari pengalaman; kualitatif; memahami</td><td>Posisi karyawan terhadap atasan</td></tr><tr><td>Pragmatis</td><td>Berpusat pada masalah, aksi & konsekuensi; metode fleksibel</td><td>Hukuman grafiti menurunkan perilaku menyimpang?</td></tr><tr><td>Transformatif</td><td>Normatif, kelompok terpinggirkan, relevan kebijakan</td><td>Mengurangi stigma penyakit tertentu</td></tr></table>
<details open><summary>Kuantitatif vs kualitatif</summary><div><b>Kuantitatif</b>: terstandar, hipotesis ditetapkan awal, istilah didefinisikan tegas, sampel besar → generalisasi statistik, <i>menjelaskan</i> (Weber). <b>Kualitatif</b>: pertanyaan fleksibel, terbuka pada makna ("konsep sensitif" – Blumer), sampel kecil → bukan generalisasi statistik, <i>memahami</i>.</div></details>`,
q:["Aliran yang berfokus kelompok terpinggirkan dan hasil relevan kebijakan?",["Post-positivis","Pragmatis","Transformatif"],2,"Perspektif transformatif bersifat normatif dan berorientasi kebijakan."]},
{t:"Metodologi & Proses Penelitian (2.5)",b:`<p><b>Metodologi</b> = jembatan antara teori dan empirisme; refleksi kritis atas penerapan metode. Asumsi teoretis membentuk pertanyaan, hipotesis, metode, dan interpretasi (contoh: teori neo-Marxis untuk pekerjaan tak tetap). Teori harus jelas dan <b>dapat dikritik</b> (Opp).</p>
<details open><summary>Proses linier (kuantitatif)</summary><div>Pertanyaan riset → teori → <b>hipotesis</b> (pernyataan kondisional yang bisa diverifikasi) → operasionalisasi ke angka → pengumpulan data → uji → kesimpulan terhadap teori.</div></details>
<details open><summary>Proses sirkular (kualitatif)</summary><div>Hermeneutik/interpretatif: tidak menguji teori yang ada, tetapi <b>membangun teori baru</b> (mis. <i>grounded theory</i>) lewat perbandingan berulang kasus baru hingga tidak ada data baru ditemukan.</div></details>`,
q:["Proses penelitian sirkular khas untuk…",["Penelitian kualitatif","Survei skala besar","Eksperimen laboratorium"],0,"Pendekatan kualitatif berulang antara data dan pembentukan teori."]},
{t:"Pengumpulan Data di CSS (3.1)",b:`<p>Metode non-reaktif (analisis konten, observasi terselubung) dan reaktif (survei, eksperimen). CSS memperkaya langkah pengolahan sehingga <b>sumber data baru</b> dapat dipakai.</p>
<table><tr><th></th><th>Ilmu Sosial klasik</th><th>Ilmu komputer / CSS</th></tr><tr><td>Data</td><td>Dikumpulkan khusus untuk riset</td><td>Memanfaatkan dataset yang sudah ada (data dibuat untuk tujuan lain)</td></tr><tr><td>Urutan</td><td>Model dirumuskan <i>sebelum</i> data</td><td>Pandangan holistik atas data; cari solusi optimal</td></tr></table>
<details open><summary>Contoh 1: Imputasi (He dkk.)</summary><div>Layanan hospis pasien kanker AS: catatan pasien hanya 2.417 data valid; digabung data Medicare naik jadi 2.669. Dua sumber saling melengkapi → validitas naik.</div></details>
<details><summary>Contoh 2: Atlet Bundesliga (van der Zeen dkk.)</summary><div>Survei harian 44 hari + data pergerakan smartphone (GNSS). Survei lebih lengkap; data GNSS tersebar tidak merata (120.938 titik posisi, tetapi hanya 263 kasus yang bisa dianalisis). Pelajaran: refleksikan asal, tujuan, dan keterbatasan data.</div></details>`,
q:["Apa ciri khas data di ilmu komputer/CSS dibanding ilmu sosial klasik?",["Selalu dikumpulkan sendiri","Sering memakai dataset yang awalnya dibuat untuk tujuan lain","Tidak pernah memakai survei"],1,"Penelitian CSS sering mengidentifikasi & memakai ulang data yang sudah ada."]},
{t:"Laporan Reproducible & Dasbor",b:`<p><b>R Markdown</b> (di RStudio) menggabungkan teks, kode, tabel, dan grafik; keluaran HTML/PDF/Word. Data baru? Cukup ubah dataset lalu klik <b>Knit</b>. (Contoh: laporan survei untuk 28.000 undangan.)</p>
<div class="key">Dasbor memungkinkan komunikasi ke publik luas secara dinamis, tidak statis seperti artikel. Contoh: grafik interaktif NYT (mobilitas sosial), OurWorldInData (vaksinasi).</div>
<details open><summary>Alat & komponen R Shiny</summary><div>Alat: Datawrapper, Tableau, ArcGIS, atau kode kustom (R/Shiny, Python). Shiny = <b>data + kode + antarmuka pengguna</b>; tiap pengguna mendapat instans R sendiri di balik browser.</div></details>
<details><summary>3 kriteria dasbor yang baik</summary><div>1) Transparansi sumber data · 2) Deskripsi jelas instrumen & metode hitung · 3) Penyajian mudah dibaca & tidak ambigu. Hanya data <b>agregat</b> ditampilkan untuk menjaga privasi.</div></details>`,
q:["Keunggulan utama R Markdown?",["Mengganti peneliti","Menghubungkan kode, output, dan teks dalam satu dokumen yang mudah diperbarui","Membuat data lebih akurat"],1,"Cukup ubah data lalu knit ulang."]},
{t:"Gambaran Pelajaran 4: ML, SNA, Visualisasi",b:`<p>Tiga topik: <b>Machine Learning</b> (algoritma belajar pola otomatis; contoh: pengenalan wajah, filter spam), <b>Analisis Jaringan Sosial/SNA</b> (siapa terhubung dengan siapa; melacak penyebaran informasi & disinformasi), dan <b>Visualisasi data</b> (mengapa & kapan grafis lebih baik).</p>`,
q:["SNA berguna untuk…",["Melacak penyebaran informasi/disinformasi dan struktur komunitas","Menghapus data hilang","Menerjemahkan teks"],0,"SNA mengidentifikasi aktor berpengaruh dan struktur sosial."]},
{t:"Machine Learning dalam CSS (4.1)",b:`<p>Contoh <b>Cantú</b>: CNN dipakai memeriksa gambar surat suara pemilu Meksiko 1988 untuk mendeteksi kecurangan (53.249 kartu registrasi diubah; mis. angka 4→1, 6→8). Otomatisasi pekerjaan yang manual berminggu-minggu.</p>
<details open><summary>3 jenis ML</summary><div><b>Supervised</b> (ada label: klasifikasi, regresi) · <b>Unsupervised</b> (tanpa label: clustering) · <b>Reinforcement</b> (belajar lewat reward, mis. catur/Go).</div></details>
<details><summary>ML vs metode klasik</summary><div>Regresi logit multinomial: peneliti memilih sedikit variabel berdasar teori. ML: banyak fitur, bentuk fungsi fleksibel, dinilai dengan <b>prediksi di luar sampel</b>.</div></details>
<details open><summary>Alur latihan (data AUTNES 2017: 4.400 responden, 43 atribut; 830 tidak menjawab pilihan partai)</summary><div>Data → pilih model → pra-proses → latih → evaluasi pada data tak dikenal.<br>• <b>Decision tree</b> (kriteria split: indeks Gini): akurasi 85% data latih vs 50% data uji = <b>overfitting</b>.<br>• <b>Random forest</b> (2–100 pohon, suara mayoritas): meningkat lebih dari 6%. Lalu dipakai mengisi nilai yang hilang.</div></details>
<p><b>Coba:</b> geser jumlah pohon (ilustrasi konsep, bukan angka asli video).</p>
<input type="range" min="1" max="100" value="1" id="rf" style="width:100%"><div id="rfo" class="fb"></div>`,
q:["Akurasi 85% (latih) vs 50% (uji) menunjukkan…",["Model sempurna","Overfitting","Data terlalu besar"],1,"Gap besar antara latih dan uji = generalisasi buruk."]},
{t:"Analisis Jaringan Sosial (4.2)",b:`<p>Jaringan = <b>simpul (node)</b> + <b>sisi (edge/tie)</b>, digambarkan sebagai graf. Tiga ukuran sentralitas:</p>
<table><tr><th>Ukuran</th><th>Arti</th></tr><tr><td>Degree</td><td>Jumlah tautan langsung (aktivitas/prestise)</td></tr><tr><td>Closeness</td><td>Kebalikan jumlah jarak terpendek ke semua node (kedekatan/independensi)</td></tr><tr><td>Betweenness</td><td>Seberapa sering node berada di jalur terpendek pasangan lain (kontrol aliran informasi)</td></tr></table>
<div class="card"><b>Coba interaktif</b> (graf ilustrasi, bukan gambar persis di video; nilai dihitung langsung): pilih ukuran, lalu klik node.<div id="mz"></div><svg id="sv" viewBox="0 0 420 250" width="100%"></svg><div id="no" class="fb">Klik sebuah node.</div></div>
<details><summary>Contoh nyata: Pemilu federal Jerman 2021</summary><div>Jaringan akun Facebook/Instagram yang membagikan konten politik 6 minggu sebelum pemilu; tautan = berbagi konten yang sama (sinyal <b>koordinasi</b>). Ukuran node = aktivitas, warna = komunitas, node di antara komunitas = penghubung. Jaringan terkoordinasi bisa dipakai penerbit, komunitas partisan, bahkan penyebar disinformasi.</div></details>`,
q:["Ukuran yang menunjukkan kontrol atas aliran informasi?",["Degree","Closeness","Betweenness"],2,"Betweenness menghitung peluang komunikasi lewat node tertentu."]},
{t:"Visualisasi Data (4.3)",b:`<p>Grafis lebih mudah diproses otak: tabel 46 angka partisipasi pemilih Austria sejak 1945 sulit dibaca, grafik garis langsung menunjukkan tren turun. Kekurangannya: nilai persis sulit dibaca.</p>
<div class="key"><b>Rasio Tinta-Data (Edward Tufte)</b> = tinta untuk data ÷ total tinta. Prinsip: <i>lebih sedikit lebih baik</i>.</div>
<div class="card"><b>Latihan:</b> centang elemen yang <i>tidak perlu</i> untuk dihapus.<br>
<label><input type=checkbox class=ck data-v=1> Efek 3D</label><br><label><input type=checkbox class=ck data-v=1> Latar biru & garis panduan</label><br><label><input type=checkbox class=ck data-v=1> Legenda yang menduplikasi info</label><br><label><input type=checkbox class=ck data-v=0> Label persentase di tiap batang</label><div id="ckf" class="fb"></div></div>`,
q:["Menurut Tufte, apa tujuan memaksimalkan rasio tinta-data?",["Menambah dekorasi","Menghapus elemen yang tidak menyampaikan informasi","Memakai warna lebih banyak"],1,"Hilangkan semua yang tidak perlu."]},
{t:"Tantangan Hukum & Etika (Pelajaran 5)",b:`<p>Isu utama: <b>perlindungan data</b>, <b>hak cipta</b>, dan perlakuan transparan terhadap partisipan (<b>informed consent</b>) — dipertimbangkan <i>sebelum</i> pengumpulan data (termasuk skripsi/tesis).</p>
<details open><summary>Hukum: GDPR</summary><div>Data pribadi = informasi yang mengidentifikasi/dapat mengidentifikasi seseorang (badan hukum tidak dilindungi). Prinsip: legalitas pemrosesan (persetujuan, dasar hukum, kontrak), minimalisasi data; hak subjek data (akses, keberatan); langkah teknis (mis. pseudonimisasi sedini mungkin). Austria punya pengecualian riset (Undang-Undang Organisasi Penelitian).<br><b>Hak cipta</b>: ada pengecualian riset, termasuk <i>text & data mining</i> (amandemen 2021 di Austria); hak mengutip.</div></details>
<details open><summary>Etika penelitian</summary><div>Prinsip: integritas ilmiah, <b>non-maleficence</b> (jangan merugikan), <b>self-determination</b> (info lengkap + persetujuan sukarela). Dokumen: Deklarasi Helsinki, Laporan Belmont.<br><b>Masalah CSS</b>: data dikumpulkan platform (apakah T&C = informed consent?), data apa yang akan dikumpulkan belum jelas di awal, skala besar. Menurut Salganik, semua data bisa sensitif: riwayat Netflix "anonim" + rating IMDb mengidentifikasi seseorang. Kasus <b>Encore</b>: browser orang diam-diam mengakses situs yang mungkin diblokir; dewan etik menolak meninjau karena dianggap bukan riset subjek manusia.</div></details>
<details><summary>Anonim vs pseudonim</summary><div><b>Pseudonim</b>: identitas diganti kode, tabel kunci disimpan terpisah → <i>masih data pribadi</i>. <b>Anonim</b>: kunci dihapus, tak bisa dilacak → umumnya bukan data pribadi (selama tak bisa dikembalikan dengan upaya wajar). Tip: abstraksikan (mis. Katolik=1, lainnya=0; kode pos → tingkat negara bagian).</div></details>
<details><summary>Saran praktis para pakar</summary><div>• Pikirkan sejak awal; <b>tanya sebelum, bukan sesudah</b>. • Risiko etis bisa menimpa orang yang bukan sumber data (model dari negara A dipakai di negara B). • Desain riset yang tak mampu menjawab pertanyaan juga bermasalah etis. • Sitasi dataset dan pembuatnya dengan benar. • Data media sosial longitudinal bisa tak benar-benar anonim; konsultasi ahli.</div></details>`,
q:["Data pseudonim menurut hukum perlindungan data adalah…",["Data non-pribadi","Tetap data pribadi","Bebas dari GDPR"],1,"Selama masih bisa dihubungkan kembali lewat kunci, ia tetap data pribadi."]},
{t:"Studi Kasus: Survey Attrition",b:`<p><b>Survey attrition</b> = responden berhenti sebelum survei selesai → mengurangi keterwakilan. Teori: pendidikan & minat politik tinggi → lebih kecil kemungkinan keluar; ideologi ekstrem & frustrasi pada sistem → lebih besar. Faktor sering spesifik konteks.</p>
<div class="key">Dirumuskan sebagai <b>klasifikasi biner</b> (ikut gelombang berikut / tidak). Fitur: sosiodemografis, dan <b>parafitur</b> (waktu menjawab, memakai smartphone) yang sering meningkatkan akurasi.</div>
<details open><summary>Demo (Axel Böhm)</summary><div>Fitur dengan &gt;90% nilai hilang diabaikan; sisanya diisi rata-rata. Model: regresi logistik, decision tree, SVM. Fitur kunci pada tree dan logit: <b>jumlah hari menyelesaikan survei</b>.</div></details>
<div class="card"><b>Jebakan akurasi:</b> &gt;80% peserta ikut lagi tiap gelombang. Model yang selalu menebak "ikut" sudah 80% akurat padahal tak belajar apa pun. Karena itu pakai <b>presisi</b> (seberapa tepat prediksi "keluar") dan <b>recall</b> (berapa banyak yang keluar berhasil teridentifikasi).</div>`,
q:["Mengapa akurasi saja menyesatkan di kasus attrition?",["Kelas tak seimbang: menebak 'ikut' untuk semua sudah ~80%","Karena datanya terlalu kecil","Karena regresi logistik tidak bisa"],0,"Gunakan presisi dan recall."]},
{t:"CSS Terapan: Polarisasi Survei + Twitter",b:`<p>Proyek Hadler (Graz) & Lex (TU Graz): menggabungkan <b>survei 2020</b> (Austria, Jerman, Swiss berbahasa Jerman; opini soal vaksinasi, masker, pelacakan kontak) dengan <b>analisis sentimen tweet</b> (NLP; kamus <b>LIWC</b>; polaritas positif/negatif/netral).</p>
<details open><summary>Temuan</summary><div>• Vaksinasi = topik <b>paling terpolarisasi</b> di Twitter (dispersi terbesar) dengan median tertinggi (dukungan lebih besar). • Rata-rata sikap survei dan Twitter serupa: masker cenderung ditolak. • Sekitar 30% responden membagikan akun, tetapi sebagian privat/salah nama/tak bicara COVID. • Kesepakatan opini di level individu <b>sangat tinggi</b>.</div></details>
<div class="key"><b>Peringatan:</b> tidak bisa mengekstrapolasi Twitter ke opini publik — penggunanya lebih muda & berpendidikan. Hanya memakai Twitter akan membuat opini publik terlihat jauh lebih positif.</div>`,
q:["Mengapa hasil Twitter tak bisa mewakili opini publik?",["Tweet terlalu pendek","Penggunanya lebih muda & berpendidikan daripada populasi","Twitter tidak punya data teks"],1,"Masalah representasi/bias sampel."]},
{t:"Masa Depan: Keadilan, Privasi, Interpretabilitas",b:`<p>Integrasi ilmu sosial & ilmu data akan makin dalam. Ilmu data mendapat data menarik & pertanyaan teoretis terbuka; ilmu sosial mendapat metode untuk memanfaatkan <b>seluruh informasi</b> dataset, bukan hanya variabel tunggal.</p>
<details open><summary>Tiga tema sentral</summary><div><b>Keadilan</b>: tingkat <i>kelompok</i> (mis. model tak boleh memprediksi pemilih pria lebih baik daripada wanita) & <i>individu</i> (orang serupa diperlakukan sama).<br><b>Privasi</b>: <i>differential privacy</i>, data sintetis realistis, enkripsi, anonimisasi.<br><b>Interpretabilitas</b>: tujuan bukan sekadar akurasi prediksi, melainkan memahami faktor pendorong.</div></details>
<div class="key">Tantangan: menemukan <b>bahasa bersama</b>, mempertimbangkan pendekatan teoretis, mengevaluasi beragam analisis, dan menggabungkan metode statistik & algoritma. Program magister yang menggabungkan kedua pendekatan juga direncanakan.</div>
<p>🎉 Selesai! Kerjakan kuis tiap bab untuk melengkapi progres.</p>`,
q:["Algoritma 'adil di tingkat individu' berarti…",["Semua kelompok diperlakukan sama rata-rata","Orang yang serupa diperlakukan sama","Akurasi 100%"],1,"Dua pemilih yang sangat mirip tak boleh diprediksi sangat berbeda."]}

const X={
0:`<p><b>Latar belakang.</b> Istilah CSS dipopulerkan artikel "Computational Social Science" (Lazer dkk., <i>Science</i>, 2009). Pendorongnya: jejak digital (email, ponsel, media sosial) merekam perilaku skala besar yang sebelumnya hanya bisa ditebak lewat survei. Buku <i>Bit by Bit</i> (Matthew Salganik, 2018) merangkum cara kerja barunya: mengamati perilaku, mengajukan pertanyaan, menjalankan eksperimen, dan membuat kolaborasi massal.</p><p><b>Empat kegiatan inti CSS:</b> (1) <i>pengukuran</i> dari data digital, (2) <i>prediksi</i>, (3) <i>penjelasan kausal</i> (eksperimen, kuasi-eksperimen), (4) <i>simulasi</i> seperti agent-based modelling untuk menguji mekanisme teoretis.</p><p><b>Catatan kritis:</b> data besar bukan otomatis data baik. Ia sering <i>tidak representatif</i>, <i>berubah</i> karena platform mengubah algoritma, dan <i>tidak dibuat untuk riset</i>.</p>`,
3:`<p><b>Lebih dalam tentang matriks jaringan.</b> Jaringan nyata biasanya <i>jarang</i> (sparse): dari jutaan pasangan yang mungkin, hanya sedikit yang terhubung. Maka disimpan sebagai daftar sisi atau sparse matrix, bukan tabel penuh. Ukuran sederhana: <b>kepadatan (density)</b> = jumlah sisi nyata ÷ jumlah sisi yang mungkin.</p><p><b>Embedding.</b> "Ruang vektor" pada representation learning berarti tiap node (atau kata, dokumen) diberi sederet angka sehingga kemiripan = kedekatan. Contoh teknik: PCA, t-SNE, UMAP untuk visualisasi, serta node2vec dan graph neural network untuk jaringan. Peringatan: jarak dan klaster di plot 2D hasil t-SNE/UMAP tidak selalu bermakna kuantitatif; jangan tafsirkan berlebihan.</p><p><b>Homofili vs pengaruh.</b> Orang serupa berteman (<i>seleksi</i>) atau berteman lalu menjadi serupa (<i>pengaruh sosial</i>). Data jaringan saja sulit membedakan keduanya, sehingga butuh data longitudinal atau desain kausal.</p><p><b>Clustering lain:</b> k-means, hierarchical clustering, dan untuk jaringan <i>community detection</i> (mis. algoritma Louvain, ukuran kualitas: modularity).</p>`,
4:`<p><b>Bias–varians (bias–variance).</b> Model terlalu sederhana → <i>underfitting</i> (bias tinggi, salah di mana-mana). Model terlalu kompleks → <i>overfitting</i> (varians tinggi, peka pada data latih tertentu). Tujuannya titik tengah.</p><p><b>Cara menguji generalisasi dengan benar:</b> pisahkan data latih/validasi/uji; <b>cross-validation</b> (k-fold) membagi data k bagian dan bergiliran menguji, sehingga estimasi lebih stabil. Jangan menyetel model berulang-ulang memakai data uji (<i>data leakage</i>).</p><p><b>Regularisasi:</b> L2 (ridge) mengecilkan bobot; L1 (lasso) mendorong sebagian bobot menjadi nol sehingga sekaligus memilih fitur. Early stopping dan dropout dipakai pada jaringan saraf.</p><p><b>Metrik klasifikasi:</b> presisi = TP/(TP+FP); recall = TP/(TP+FN); F1 = rata-rata harmonik keduanya; AUC-ROC mengukur kemampuan memisahkan kelas. Pilih metrik sesuai biaya kesalahan.</p><p><b>Prediksi ≠ penjelasan.</b> Model yang akurat tidak otomatis menunjukkan sebab. Bobot regresi pun hanya korelasi bersyarat kecuali ada desain kausal.</p>`,
5:`<p><b>Tiga lapis asumsi:</b> <i>ontologi</i> (apa realitas sosial itu), <i>epistemologi</i> (bagaimana kita bisa tahu), <i>metodologi</i> (cara menyelidiki). Paradigma adalah paket asumsi ini. Post-positivisme umumnya mengasumsikan realitas objektif yang hanya bisa diketahui tak sempurna; konstruktivisme mengasumsikan realitas dibangun secara sosial.</p><p><b>Implikasi untuk CSS:</b> metode komputasional bukan "netral". Memilih apa yang dihitung (kamus sentimen, operasionalisasi konsep) adalah keputusan teoretis. Banyak peneliti kini memakai <i>mixed methods</i>: komputasi untuk skala, pembacaan kualitatif untuk validasi makna (pendekatan "grounded" dalam teks, atau <i>close reading</i> sampel dari hasil algoritma).</p><p><b>Validitas</b> yang perlu dipisahkan: validitas konstruk (mengukur apa yang dimaksud), internal (klaim kausal tepat), eksternal (berlaku di luar sampel), dan reliabilitas (konsisten diulang).</p>`,
7:`<p><b>Data "ditemukan" vs "dibuat"</b> (istilah Salganik: <i>found</i> vs <i>made</i> / <i>readymades</i> vs <i>custommades</i>). Data digital ditemukan punya kelebihan: besar, selalu aktif, non-reaktif. Kekurangan: sering <i>tidak lengkap</i>, <i>tidak representatif</i>, <i>terdorong algoritma platform</i> (algorithmically confounded), <i>tak terjangkau</i> (akses API dibatasi), dan <i>sensitif</i>.</p><p><b>Teknik umum:</b> API resmi, web scraping (periksa ketentuan layanan dan hukum), data donasi (<i>data donation</i> dari pengguna), tracking browser/aplikasi dengan persetujuan, dan survei di platform riset.</p><p><b>Kerangka Total Error.</b> Survei klasik punya <i>Total Survey Error</i> (error cakupan, sampling, nonrespons, pengukuran, pemrosesan). Untuk data digital ada padanannya (<i>Total Error Framework</i>, Sen dkk.): masalah apa yang masuk saat data dihasilkan, diakses, dan dibersihkan.</p><p><b>Linking data:</b> menghubungkan survei dan jejak digital (seperti proyek Hadler dan Lex) memberi validasi, tetapi menaikkan risiko re-identifikasi dan menuntut persetujuan eksplisit.</p><p><b>Imputasi.</b> Data hilang bisa <i>MCAR</i> (acak total), <i>MAR</i> (acak bersyarat variabel teramati), atau <i>MNAR</i> (bergantung pada nilai yang hilang itu sendiri). Imputasi rata-rata sederhana, tetapi dapat meremehkan varians; <i>multiple imputation</i> lebih disarankan secara statistik.</p>`,
10:`<p><b>Confusion matrix</b> merangkum TP, FP, TN, FN; dari sini lahir akurasi, presisi, recall. <b>Decision tree</b> memilih split yang menurunkan <i>impurity</i>; indeks Gini = 1 − Σp², makin kecil makin murni. <b>Random forest</b> menggabungkan banyak pohon yang dilatih pada sampel acak (bagging) dan subset fitur acak, sehingga varians turun.</p><p><b>Interpretabilitas.</b> Ukuran <i>feature importance</i>, <i>permutation importance</i>, dan SHAP membantu menjelaskan model kompleks, tetapi menjelaskan model ≠ menjelaskan dunia sosial. Hati-hati juga dengan <b>kebocoran</b> (fitur yang secara tak langsung berisi jawaban).</p><p><b>ML untuk teks (NLP) dalam CSS:</b> bag-of-words, TF-IDF, <i>topic model</i> (LDA, BERTopic), <i>word embedding</i>, dan model bahasa besar untuk anotasi. Praktik baik: validasi hasil terhadap label manusia, laporkan kesepakatan antarpenilai, dan jangan memakai sentimen/kamus di domain atau bahasa yang berbeda tanpa validasi ulang (kamus berbahasa Inggris tidak otomatis cocok untuk bahasa Indonesia).</p>`,
11:`<p><b>Ukuran tambahan.</b> <i>Eigenvector centrality</i> dan <i>PageRank</i> menilai node penting jika terhubung ke node penting lain. Tingkat jaringan: <i>density</i>, <i>diameter</i>, <i>clustering coefficient</i>, <i>reciprocity</i> (pada jaringan berarah).</p><p><b>Struktur klasik:</b> <i>small world</i> (jarak rata-rata pendek meski jaringan besar), distribusi derajat berekor panjang (segelintir hub dengan banyak tautan), dan "kekuatan ikatan lemah" Granovetter (ikatan lemah menjembatani kelompok berbeda dan membawa informasi baru).</p><p><b>Penggunaan di media sosial:</b> echo chamber/polarisasi (jaringan retweet yang terbelah dua klaster), deteksi aktivitas terkoordinasi, difusi informasi. <b>Kehati-hatian:</b> tautan di media sosial (follow, retweet) bukan selalu hubungan sosial nyata; retweet bukan selalu persetujuan; sentralitas bergantung definisi tautan dan batas jaringan yang dipilih. Untuk analisis statistik inferensial, model seperti ERGM dan SAOM tersedia, tetapi ini topik lanjutan.</p>`,
13:`<p><b>Pendalaman hukum.</b> GDPR Pasal 89 mengatur pengecualian untuk riset ilmiah dengan syarat <i>pengamanan yang layak</i> (mis. minimalisasi data, pseudonimisasi). Data "kategori khusus" (agama, orientasi seksual, kesehatan, pandangan politik, dll.) berlaku aturan lebih ketat. Dalam konteks Indonesia ada UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi; jika datamu menyangkut subjek di Indonesia, periksa teks undang-undang dan aturan turunannya karena detailnya berkembang, dan aku bukan ahli hukum.</p><p><b>Anonimisasi tidak sederhana.</b> <i>k-anonymity</i> menjamin tiap kombinasi atribut pengenal (usia, kode pos, jenis kelamin) dimiliki minimal k orang; <i>differential privacy</i> menambah derau terkontrol sehingga keluaran hampir tidak berubah ada/tidaknya satu individu (parameter ε: makin kecil makin privat, tetapi makin kurang akurat). Kasus Netflix Prize (Narayanan & Shmatikov) menunjukkan re-identifikasi lewat data pembantu.</p><p><b>Kerangka etika untuk riset digital:</b> Menlo Report (2012; prinsip Belmont ditambah <i>respect for law and public interest</i>) dan pedoman AoIR tentang riset internet. Pertanyaan praktis: apakah data benar-benar "publik" menurut ekspektasi penggunanya (<i>contextual integrity</i>, Nissenbaum)? Apakah mengutip tweet verbatim membuat orangnya mudah dilacak lewat pencarian?</p>`,
14:`<p><b>Mengapa attrition berbahaya:</b> jika yang keluar sistematis (mis. berpendidikan rendah), estimasi menjadi bias (<i>nonresponse bias</i>). Cara penanganan klasik: <i>weighting</i> (inverse probability weights memakai probabilitas respons dari model), imputasi ganda, dan desain insentif/kontak ulang. Prediksi attrition dari ML dapat dipakai untuk mengarahkan upaya pendekatan ke responden berisiko.</p><p><b>Rumus ringkas:</b> presisi = TP/(TP+FP), recall = TP/(TP+FN). Contoh: dari 100 orang, 20 keluar. Model menandai 10 orang "keluar" dan 8 benar → presisi 8/10 = 0,8; recall 8/20 = 0,4. Model yang selalu menebak "ikut" berakurasi 80% namun recall 0.</p><p><b>Etika:</b> memprediksi siapa yang akan keluar lalu memperlakukan mereka berbeda tidak selalu netral; periksa apakah model lebih sering salah pada kelompok tertentu.</p>`,
15:`<p><b>Mengapa media sosial bukan cerminan publik:</b> pengguna tidak representatif secara demografis; hanya sebagian kecil yang aktif memposting; kelompok vokal (sering ekstrem) bisa mendominasi; bot dan akun terkoordinasi memengaruhi hitungan. Studi Tufekci (2014) membahas jebakan seperti ini. Solusi dalam literatur: <i>post-stratification</i> / pembobotan ulang berdasarkan demografi yang diinferensi, serta triangulasi dengan survei.</p><p><b>Polarisasi bukan satu hal.</b> Bisa berarti polarisasi <i>ideologis</i> (jarak posisi), <i>afektif</i> (kebencian antarkelompok), atau <i>struktural</i> (jaringan terbelah). Analisis sentimen mengukur nada teks, bukan posisi atau polarisasi secara langsung; dispersi sentimen hanya proksi.</p><p><b>Akses data:</b> kebijakan API platform berubah cepat (termasuk pembatasan akses Twitter/X sejak 2023). Cek kondisi terkini sebelum merencanakan riset; aku tidak bisa memastikan status terbarunya tanpa mencari.</p>`,
16:`<p><b>Keadilan.</b> Definisi formal yang sering dipakai: <i>demographic parity</i> (tingkat keputusan positif sama antar kelompok), <i>equalized odds</i> (TPR dan FPR sama), dan <i>calibration</i> (probabilitas prediksi berarti sama di tiap kelompok). Hasil teoretis (Kleinberg dkk.; Chouldechova, 2016) menunjukkan bahwa kecuali kondisi khusus, beberapa definisi ini <b>tidak bisa dipenuhi serentak</b>. Jadi pilihan definisi adalah keputusan nilai, bukan sekadar teknis.</p><p><b>Privasi.</b> Selain differential privacy dan data sintetis, ada <i>federated learning</i> (model dilatih di lokasi data tanpa memusatkan data). Tidak ada teknik tunggal yang menyelesaikan semuanya; selalu ada trade-off privasi–utilitas.</p><p><b>Tren yang relevan:</b> pemakaian model bahasa besar untuk anotasi teks dan simulasi responden menarik, tetapi validitas, bias, dan reprodusibilitasnya aktif diperdebatkan; perlakukan sebagai alat yang harus divalidasi.</p>`
};

function ck(){document.querySelectorAll('.ck').forEach(c=>c.onchange=()=>{const a=[...document.querySelectorAll('.ck')],ok=a.every(x=>(x.checked)==(x.dataset.v==1));$('ckf').textContent=ok?'✅ Tepat: hapus yang tak informatif, pertahankan label data.':'Hint: elemen dekoratif/duplikat dihapus; label langsung pada data dipertahankan.'})}
function net(){const N={A:[40,60],B:[100,140],C:[170,80],D:[170,200],E:[250,120],F:[290,200],G:[330,100],H:[390,60],I:[385,170]};
const E=[['A','B'],['B','C'],['C','D'],['C','E'],['E','F'],['E','G'],['F','G'],['G','H'],['G','I'],['H','I']],K=Object.keys(N),adj={};K.forEach(k=>adj[k]=[]);E.forEach(([a,b])=>{adj[a].push(b);adj[b].push(a)});
const sp={},sg={};K.forEach(s=>{const d={[s]:0},c={[s]:1},q=[s];while(q.length){const u=q.shift();adj[u].forEach(v=>{if(d[v]==null){d[v]=d[u]+1;c[v]=0;q.push(v)}if(d[v]==d[u]+1)c[v]+=c[u]})}sp[s]={d,c}});
const M={Degree:{},Closeness:{},Betweenness:{}};K.forEach(v=>{M.Degree[v]=adj[v].length;M.Closeness[v]=1/K.reduce((a,u)=>a+sp[v].d[u],0);let b=0;K.forEach(s=>K.forEach(t=>{if(s<t&&s!=v&&t!=v&&sp[s].d[t]==sp[s].d[v]+sp[v].d[t])b+=sp[s].c[v]*sp[v].c[t]/sp[s].c[t]}));M.Betweenness[v]=b});
let m='Degree';const draw=()=>{const vals=M[m],mx=Math.max(...Object.values(vals)),top=K.filter(k=>vals[k]==mx);
$('sv').innerHTML=E.map(([a,b])=>`<line class=edge x1=${N[a][0]} y1=${N[a][1]} x2=${N[b][0]} y2=${N[b][1]}/>`).join('')+K.map(k=>`<circle class=nd cx=${N[k][0]} cy=${N[k][1]} r=${10+16*vals[k]/mx} onclick="sel('${k}')" style="${top.includes(k)?'fill:#e67e22':''}"/><text x=${N[k][0]-4} y=${N[k][1]+4}>${k}</text>`).join('');
$('no').textContent=`Tertinggi (${m}): ${top.join(', ')} (oranye).`};
$('mz').innerHTML=Object.keys(M).map(k=>`<button class="pill ${k==m?'on':''}" data-k=${k}>${k}</button>`).join('');
$('mz').onclick=e=>{if(e.target.dataset.k){m=e.target.dataset.k;net2()}};const net2=()=>{$('mz').querySelectorAll('.pill').forEach(p=>p.classList.toggle('on',p.dataset.k==m));draw()};
window.sel=k=>{$('no').textContent=`Node ${k}: degree=${M.Degree[k]}, closeness=${M.Closeness[k].toFixed(3)}, betweenness=${M.Betweenness[k].toFixed(1)}`};draw()}
go(0);
</script></body></html>
